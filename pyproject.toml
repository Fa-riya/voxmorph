[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxmorph"
version = "1.0.0"
description = "Voice transformation with classic DSP: formant-aware pitch shifting, McAdams anonymisation, robotisation and more."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Fariya Ahmed" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]
keywords = ["dsp", "speech", "voice-conversion", "pitch-shifting", "phase-vocoder", "lpc", "fastapi"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "matplotlib>=3.8"]

[project.scripts]
voxmorph = "voxmorph.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Upstream notice from starlette.testclient, not from this project.
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.ruff.lint.isort]
known-first-party = ["voxmorph", "conftest"]
